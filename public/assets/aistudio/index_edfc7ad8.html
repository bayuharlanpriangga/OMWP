<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Presentasi Interaktif</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600&family=Source+Serif+4:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff4d6;--fg:#111;--card:#fff;--ln:#111;--acc:#ff6b35;--acc2:#2ec4b6;--acc3:#ffd23f;--mut:#555;--r:10px}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:'Space Grotesk',system-ui,sans-serif;font-size:16px;line-height:1.5}
#app{min-height:100vh;display:flex;flex-direction:column}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{opacity:.35;cursor:default}
header#top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 14px;border-bottom:3px solid var(--ln);background:var(--acc3);color:#111;position:sticky;top:0;z-index:20}
.brand{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.tb{display:flex;gap:8px;flex:none}
.btn{border:3px solid var(--ln);background:var(--card);color:var(--fg);padding:6px 12px;border-radius:var(--r);box-shadow:3px 3px 0 var(--ln);font-weight:600}
.btn:active:not(:disabled){transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ln)}
.btn.sm{padding:3px 9px;font-size:13px;box-shadow:2px 2px 0 var(--ln)}
main#main{flex:1;padding:18px 14px 110px;max-width:900px;width:100%;margin:0 auto}
.kicker{font-family:'Space Mono',monospace;font-size:13px;color:var(--mut);text-transform:uppercase;letter-spacing:.08em}
h1{font-size:clamp(28px,6vw,46px);line-height:1.1;margin:6px 0 6px}
h2{margin:0 0 6px}
.hint{color:var(--mut);margin:0 0 18px;font-size:14px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));align-items:start}
.card{border:3px solid var(--ln);background:var(--card);border-radius:var(--r);box-shadow:5px 5px 0 var(--ln)}
.card.open{box-shadow:5px 5px 0 var(--acc)}
.ch{display:flex;width:100%;gap:10px;align-items:center;text-align:left;background:none;border:0;padding:14px;font-weight:700;font-size:17px}
.ch .n{flex:none;width:30px;height:30px;border:3px solid var(--ln);border-radius:50%;display:grid;place-items:center;background:var(--acc2);color:#111;font-size:14px}
.card.open .n{background:var(--acc)}
.ch .ar{margin-left:auto;font-size:12px;transition:transform .2s}
.card.open .ar{transform:rotate(90deg)}
.cb{display:none;margin:0 14px 14px;padding-top:12px;border-top:3px dashed var(--ln)}
.card.open .cb{display:block}
.term{border:0;border-bottom:3px solid var(--acc);background:var(--acc3);color:#111;padding:0 4px;font:inherit;font-weight:600;border-radius:3px}
.cbtn{margin-top:24px}
.concl{margin-top:14px;border:3px solid var(--ln);background:var(--acc2);color:#111;padding:16px;border-radius:var(--r);box-shadow:5px 5px 0 var(--ln);font-weight:600}
nav#nav{position:fixed;left:0;right:0;bottom:0;display:flex;align-items:center;gap:10px;padding:10px 84px 12px 14px;background:var(--bg);border-top:3px solid var(--ln);z-index:15}
.prog{flex:1;height:14px;border:3px solid var(--ln);border-radius:99px;background:var(--card);overflow:hidden}
.prog i{display:block;height:100%;background:var(--acc);transition:width .25s}
.cnt{font-family:'Space Mono',monospace;font-size:13px;min-width:38px;text-align:center}
#fab{position:fixed;right:14px;bottom:14px;width:56px;height:56px;border-radius:50%;border:3px solid var(--ln);background:var(--acc);color:#111;font-size:24px;box-shadow:4px 4px 0 var(--ln);z-index:30}
#fab.pulse{animation:pl 1.2s infinite}
@keyframes pl{50%{transform:scale(1.1)}}
#fab .dot{position:absolute;top:-5px;right:-5px;width:18px;height:18px;border-radius:50%;background:#e63946;border:3px solid var(--ln)}
#bubble{position:fixed;right:12px;bottom:82px;width:min(390px,calc(100vw - 24px));height:min(62vh,500px);display:flex;flex-direction:column;border:3px solid var(--ln);background:var(--card);border-radius:14px;box-shadow:6px 6px 0 var(--ln);z-index:30;overflow:hidden}
#bubble[hidden],#modal[hidden]{display:none}
.bh{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--acc3);color:#111;border-bottom:3px solid var(--ln);font-weight:700}
.bh span{flex:1}
.bm{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
.msg{padding:10px 12px;border:3px solid var(--ln);border-radius:12px;font-size:15px;max-width:94%;word-wrap:break-word}
.msg.user{align-self:flex-end;background:var(--acc2);color:#111}
.msg.ai{align-self:flex-start}
.msg.err{background:#ffb4a9;color:#111}
.qs{padding:0 10px 8px}
.bf{display:flex;gap:8px;padding:10px;border-top:3px solid var(--ln)}
input,textarea,select{font:inherit;color:var(--fg);background:var(--card);border:3px solid var(--ln);border-radius:8px;padding:8px 10px;width:100%}
input[type=checkbox]{width:auto;margin-right:8px}
textarea{min-height:76px;resize:vertical}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:grid;place-items:center;z-index:50;padding:14px}
.mc{background:var(--card);border:3px solid var(--ln);box-shadow:6px 6px 0 var(--ln);border-radius:14px;padding:18px;width:min(440px,100%);max-height:90vh;overflow:auto}
.mc label,.ed label{display:block;font-weight:700;margin:12px 0 4px;font-size:14px}
.note{font-size:13px;color:var(--mut)}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.chip{min-width:42px}
.chip.on{background:var(--acc);color:#111}
.panel{border:3px solid var(--ln);background:var(--card);border-radius:var(--r);padding:14px;box-shadow:5px 5px 0 var(--ln)}
.prow{border:3px dashed var(--ln);border-radius:8px;padding:10px;margin-top:12px}
/* ---- v2: canvas bebas, mode isi & layout ---- */
header#top{flex-wrap:wrap}
main#main{max-width:1000px}
.seg{display:flex;gap:6px}
.btn.on{background:var(--acc);color:#111}
.lbl{display:none}
@media(min-width:560px){.lbl{display:inline}}
.cv{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px;align-items:start}
.blk{min-width:0}
.slide{min-height:calc(100vh - 200px);display:flex;flex-direction:column}
.slide.vc{justify-content:center}
.card{color:var(--fg)}
.tx{margin:0;overflow-wrap:anywhere}
.s-s{font-size:14px}.s-m{font-size:18px}.s-l{font-size:28px;line-height:1.25}
.s-xl{font-size:clamp(28px,6vw,46px);line-height:1.1}.s-xxl{font-size:clamp(38px,9vw,84px);line-height:1.05}
.a-l{text-align:left}.a-c{text-align:center}.a-r{text-align:right}.bd{font-weight:700}
.box{padding:14px}.bt{font-weight:700;font-size:20px;margin-bottom:12px}
.ph{color:var(--mut);font-style:italic;font-size:14px}
.cv.ed{display:flex;flex-direction:column;gap:12px}
.ec{border:3px dashed var(--ln);border-radius:8px;padding:10px;background:rgba(128,128,128,.07)}
.eh{display:flex;align-items:center;justify-content:space-between}
.ec input,.ec textarea{margin-top:6px}
textarea.autog{min-height:44px;resize:none;overflow:hidden}
.lay .blk{position:relative;outline:2px dashed rgba(128,128,128,.6);outline-offset:3px;cursor:pointer}
.lay .blk.sel{outline:3px solid var(--acc)}
.lay .blk.drag{opacity:.55}
.lay .ch,.lay .concl,.lay span.btn{pointer-events:none}
.mv,.rz,.wb{position:absolute;z-index:5;border:3px solid var(--ln);background:var(--acc);color:#111;font-weight:700;display:grid;place-items:center;user-select:none}
.mv{top:-16px;left:-12px;width:32px;height:32px;border-radius:8px;cursor:grab;touch-action:none}
.rz{right:-14px;bottom:-14px;width:30px;height:30px;border-radius:6px;cursor:nwse-resize;touch-action:none;background:var(--acc2)}
.wb{top:-14px;right:-8px;padding:0 6px;font-size:12px;border-radius:6px;background:var(--acc3)}
.m-layout{padding-bottom:240px!important}
.fs [data-act=full]{display:none}
#toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:60;background:#111;color:#fff;border:3px solid var(--ln);border-radius:99px;padding:8px 18px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:opacity .3s}
#toast.show{opacity:1}
.im{display:block;width:100%;height:auto;border-radius:6px}
.zm{cursor:zoom-in}
.lay .im{pointer-events:none}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:70;display:grid;place-items:center;padding:12px;cursor:zoom-out}
#lb img{max-width:100%;max-height:100%;object-fit:contain}
#insp{position:fixed;left:0;right:0;bottom:0;padding:10px 84px 12px 14px;background:var(--bg);border-top:3px solid var(--ln);z-index:15;max-height:45vh;overflow:auto}
#insp[hidden]{display:none}
#insp .row{margin-top:8px}
.ih{display:flex;align-items:center;gap:10px}.ih b{flex:1}

/* ===== sistem tema: brutal (bawaan) & auditor ===== */
.tcard{display:block;width:100%;text-align:left;margin-top:10px;padding:10px 12px}
.tcard span{display:block;font-weight:400;margin-top:2px}
.rv{opacity:0;transform:translateY(34px) rotate(-1deg) scale(.97);transition:opacity .35s,transform .45s cubic-bezier(.2,1.5,.4,1)}
.rv.in{opacity:1;transform:none}
.rv.nt{transition:none}
@keyframes bn{from{opacity:0;transform:translateX(70px) rotate(1.5deg)}to{opacity:1;transform:none}}
@keyframes bp{from{opacity:0;transform:translateX(-70px) rotate(-1.5deg)}to{opacity:1;transform:none}}
@keyframes bo{from{opacity:0;transform:scaleY(.6)}to{opacity:1;transform:none}}
.an-next{animation:bn .38s cubic-bezier(.2,1.3,.4,1)}
.an-prev{animation:bp .38s cubic-bezier(.2,1.3,.4,1)}
.card.open .cb{animation:bo .22s ease-out;transform-origin:top}

:root[data-theme=auditor]{--bg:#f4f6f9;--fg:#1b2430;--card:#fff;--ln:#14243d;--acc:#b08d3c;--acc2:#14243d;--acc3:#14243d;--mut:#5b6677;--r:6px}
[data-theme=auditor] body{font-family:'Inter',system-ui,sans-serif}
[data-theme=auditor] .brand,[data-theme=auditor] .bt,[data-theme=auditor] .ch,[data-theme=auditor] .tx.s-l,[data-theme=auditor] .tx.s-xl,[data-theme=auditor] .tx.s-xxl,[data-theme=auditor] h2{font-family:'Source Serif 4',Georgia,serif}

[data-theme=auditor] .bf{border-top:1px solid #d5dbe5}
[data-theme=auditor] input,[data-theme=auditor] textarea,[data-theme=auditor] select{border:1px solid #c5ccd8;border-radius:6px}

[data-theme=auditor] .mv,[data-theme=auditor] .rz,[data-theme=auditor] .wb{border:2px solid #fff;background:#14243d;color:#fff;box-shadow:0 1px 4px rgba(0,0,0,.4)}
[data-theme=auditor] .rz{background:#b08d3c}
[data-theme=auditor] #toast{background:#14243d;border:0;border-radius:8px}

@keyframes af{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

.hb{display:flex;gap:6px}
.rte{margin-top:6px;min-height:44px;border:3px solid var(--ln);border-radius:8px;padding:8px 10px;background:var(--card);color:var(--fg);outline:none;overflow-wrap:anywhere;white-space:pre-wrap}
.rte:empty::before{content:attr(data-ph);color:var(--mut);font-style:italic;font-size:16px;font-weight:400}
.rte:focus{box-shadow:0 0 0 3px var(--acc)}

@keyframes fxa{from{transform:scale(.1);opacity:1}to{transform:scale(1);opacity:0}}

 penolong]]."}],"conclusion":"Biaya produksi = bahan baku langsung + tenaga kerja langsung + overhead pabrik."}]}</script>

(()=>{

const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const plain=t=>String(t||'').replace(/\[{2,3}|\]{2,3}/g,'').replace(/\*\*|\{\/?(?:s|m|l|xl)\}/g,'');
/* live=true: [[istilah]] jadi tombol klik. live=false: tampil sebagai label biasa (tanpa kurung) */
let inPM=false,MEd=false,pmId=null;const FP=new Set();
/* [[istilah]] = klik untuk penjelasan AI. [[[istilah]]] = klik untuk popup modal (bukan AI) */
const fmt=(s,live)=>{const r=fmt0(s,live);return inl(r)};
const inl=h=>{let o;do{o=h;h=h.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\{(s|m|l|xl)\}([\s\S]*?)\{\/\1\}/g,'<span class="z-$1">$2</span>')}while(h!==o);return h};
const fmt0=(s,live)=>esc(s).replace(/\[\[\[(.*?)\]\]\]|\[\[(.+?)\]\]/g,(m,a,t)=>{
  if(a!==undefined){a=a.trim();const c='term mt'+(a?'':' e'),lb=a||'ⓘ';return live&&!inPM?'<button class="'+c+'" data-mt="'+a+'">'+lb+'</button>':'<span class="'+c+'">'+lb+'</span>'}
  return live?'<button class="term" data-term="'+t+'">'+t+'</button>':'<span class="term">'+t+'</span>'}).replace(/\n/g,'<br>');
const fmtAI=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/^\s*[-*] /gm,'• ').replace(/\n/g,'<br>');
const LS=(k,v)=>{try{if(v===undefined){const x=localStorage.getItem(k);return x?JSON.parse(x):null}localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}};
const uid=()=>Math.random().toString(36).slice(2,9);
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
const T=(text,size,align,b)=>({id:uid(),t:'text',text,size:size||'m',align:align||'l',w:12,b:!!b});

const THEMES={brutal:{n:'Brutalis',d:'Tebal, warna cerah, garis hitam, bayangan keras, animasi membal.'},auditor:{n:'Auditor',d:'Formal dan tenang: navy dan emas, huruf serif, garis tipis, animasi halus untuk presentasi audit dan laporan.'}};
/* Data v2: slide = {id,name,bg,vc,blocks:[]}; block = text | dd | box(children) | concl */
function migrate(d,cover){
  if(d.v===2)return d;
  const o={v:2,title:d.title||'Presentasi',slides:[]},old=d.slides||[];
  const sd=(name,bl)=>o.slides.push({id:uid(),name,bg:'',vc:false,blocks:bl});
  const dd=(text,detail)=>({id:uid(),t:'dd',text,detail,w:4});
  const cc=(label,text)=>({id:uid(),t:'concl',label,text,w:12});
  if(cover){sd('Cover',[T(o.title,'xxl','c',1),T('Tekan ▶ atau geser untuk mulai','m','c')]);o.slides[0].vc=true}
  old.forEach(s=>{const bl=[T(s.title||'','xl','l',1)];(s.points||[]).forEach(p=>bl.push(dd(p.text||'',p.detail||'')));if((s.conclusion||'').trim())bl.push(cc('★ Kesimpulan',s.conclusion));sd(plain(s.title||''),bl)});
  const cs=old.filter(s=>(s.conclusion||'').trim()),fc=(d.conclusion||'').trim();
  if(fc||cs.length){const bl=[T('Kesimpulan','xl','l',1)];cs.forEach(s=>bl.push(dd(s.title||'',s.conclusion)));if(fc)bl.push(cc('★ Kesimpulan akhir',d.conclusion));sd('Kesimpulan',bl)}
  return o;
}
function fixBlocks(a){a.forEach(b=>{b.id=b.id||uid();b.w=clamp(+b.w||12,1,12);if(b.y!=null){b.x=+b.x||0;b.y=+b.y||0}['text','detail','title','label'].forEach(k=>{if(b[k]==null)b[k]=''});if(b.t==='img'){b.src=b.src||'';b.alt=b.alt||''}if(b.t==='box')fixBlocks(b.children=b.children||[])})}
function walk(a,f){a.forEach(b=>{f(b);if(b.children)walk(b.children,f)})}
function scanModals(sl){
  const out=[];
  walk(sl.blocks,b=>{
    const s=b.t==='text'||b.t==='concl'?b.text:b.t==='dd'?b.detail:b.t==='box'?b.title:'';
    String(s||'').replace(/\[\[\[(.*?)\]\]\]/g,(m,t)=>{t=t.trim();if(out.indexOf(t)<0)out.push(t);return m});
  });
  return out;
}
/* satu modal per judul unik; judul = teks di dalam [[[ ]]]. Isi modal dipertahankan saat teks diedit */
function syncModals(sl){
  const want=scanModals(sl),old=sl.modals||[],mold=sl.mold||{},used=new Set();
  want.forEach(t=>{const m=old.find(x=>x.title===t);if(m)used.add(m)});
  const res=want.map((t,k)=>{
    let m=old.find(x=>x.title===t);
    if(!m){
      const c=old[k];
      if(c&&!used.has(c)){m=c;m.title=t}
      else if(mold[t]){m=mold[t];delete mold[t]}
      else m={id:uid(),title:t,children:[]};
      used.add(m);
    }
    return m;
  });
  old.forEach(m=>{if(res.indexOf(m)<0&&m.children.length)mold[m.title]=m});
  sl.modals=res;
  if(Object.keys(mold).length)sl.mold=mold;else delete sl.mold;
}
function loadDeck(d,cover){
  if(!d||!Array.isArray(d.slides)||!d.slides.length)return null;
  d=migrate(d,cover);
  d.theme=THEMES[d.theme]?d.theme:'brutal';
  d.slides.forEach(s=>{s.id=s.id||uid();s.name=s.name||'';s.blocks=s.blocks||[];fixBlocks(s.blocks);s.modals=Array.isArray(s.modals)?s.modals:[];s.modals.forEach(m=>{m.id=m.id||uid();m.title=m.title||'';fixBlocks(m.children=m.children||[])});Object.keys(s.mold||{}).forEach(k=>fixBlocks(s.mold[k].children=s.mold[k].children||[]));syncModals(s)});
  return d.slides.length?d:null;
}

  if(!arr){const sl=cur();let r=find(id,sl.blocks);if(r)return r;const ms=sl.modals||[];for(let i=0;i<ms.length;i++){if(ms[i].id===id)return{arr:ms,i,b:ms[i]};r=find(id,ms[i].children);if(r)return r}return null}
  for(let i=0;i<arr.length;i++){const b=arr[i];if(b.id===id)return{arr,i,b};if(b.children){const r=find(id,b.children);if(r)return r}}return null}
const flat=a=>a.reduce((x,b)=>x.concat(b,b.children?flat(b.children):[]),[]);
function slideTitle(sl){if(sl.name)return sl.name;const t=flat(sl.blocks).find(b=>b.t==='text'&&b.text.trim());return t?plain(t.text).split('\n')[0]:'Slide'}

function editBlock(b){
  const hd='<div class="eh"><b>'+NAMES[b.t]+'</b><button class="btn sm" data-act="delb" data-id="'+b.id+'">✕ Hapus</button></div>';

function blocksHTML(a,m){let n=0;return a.map(b=>blockHTML(b,m,b.t==='dd'?++n:0)).join('')}

  else if(b.t==='img')h=okSrc(b.src)?'<img class="im'+(live?' zm':'')+'" src="'+esc(b.src)+'" alt="'+esc(b.alt)+'" draggable="false">':'<div class="ph">(gambar kosong)</div>';
  else if(b.t==='dd'){
    const hd='<span class="n">'+n+'</span><span>'+esc(plain(b.text))+'</span><span class="ar">▶</span>';

  }else if(b.t==='box')h='<div class="card box">'+(b.title?'<div class="bt">'+fmt(b.title,live)+'</div>':'')+'<div class="cv">'+blocksHTML(b.children,m)+'</div>'+(lay&&!b.children.length?'<div class="ph">(container kosong)</div>':'')+'</div>';
  else{const lb=esc(b.label||'★ Kesimpulan');h=live?'<button class="btn" data-act="concl" data-id="'+b.id+'">'+(o?'Tutup kesimpulan':lb)+'</button>':'<span class="btn">'+lb+'</span>';if(o||lay)h+='<div class="concl'+(b.align?' a-'+b.align:'')+'">'+fmt(b.text,live)+'</div>'}
  return '<div class="blk b-'+b.t+(sel?' sel':'')+(m==='edit'?' ec':'')+'" data-id="'+b.id+'" style="grid-column:span '+b.w+'">'+h+(sel?'<span class="mv">✥</span><span class="rz"></span><span class="wb">'+b.w+'/12</span>':'')+'</div>';
}
function strip(){return '<div class="chips">'+deck.slides.map((s,i)=>'<button class="btn chip'+(i===S.i?' on':'')+'" data-act="sel" data-i="'+i+'" title="'+esc(slideTitle(s))+'">'+(i+1)+'</button>').join('')+'<button class="btn" data-act="addslide">+ Slide</button></div>'}
function slideHTML(m){const sl=cur(),an=m==='present'&&S.anim?' an-'+S.anim:'';return '<section class="slide'+(sl.vc?' vc':'')+an+'"><div class="cv root'+(m==='layout'?' lay':'')+'">'+blocksHTML(sl.blocks,m)+'</div></section>'}

    '<div class="row"><button class="btn sm" data-act="up">↑ Naik</button><button class="btn sm" data-act="down">↓ Turun</button><button class="btn sm" data-act="dupslide">Duplikat</button><button class="btn sm" data-act="delslide">Hapus slide</button></div>'+
    '<h2 style="margin-top:18px">Isi slide</h2><div class="cv ed root">'+blocksHTML(sl.blocks,'edit')+'</div>'+
    (sl.blocks.length?'':'<p class="note">Slide ini masih kosong. Tambahkan komponen di bawah.</p>')+addRow('',['text','img','dd','box','concl'])+'<div id="msec">'+modalsInner(sl)+'</div>'+
    '<p class="note">Urutan, ukuran, dan perataan diatur di mode ⇲ Layout. Tanda [[ ]] (penjelasan AI) dan [[[ ]]] (popup modal) hanya terlihat di sini; saat ditampilkan istilahnya jadi bisa diklik.</p>'+

let io=null;
function renderMain(){
  const mn=$('#main');
  document.documentElement.dataset.theme=deck.theme||'brutal';
  if(io){io.disconnect();io=null}
  mn.className='m-'+S.mode;

  S.anim=null;
  if(S.mode!=='edit')place();

  if(S.mode==='present'&&'IntersectionObserver' in window){
    io=new IntersectionObserver(es=>{let k=0;es.forEach(en=>{if(!en.isIntersecting)return;const el=en.target;el.style.transitionDelay=Math.min(k++*80,400)+'ms';el.classList.add('in');S.seen.add(el.dataset.id);io.unobserve(el)})},{threshold:.1,rootMargin:'0px 0px -70px 0px'});
    mn.querySelectorAll('.cv.root>.blk').forEach(el=>{el.classList.add('rv');if(S.seen.has(el.dataset.id))el.classList.add('in','nt');else io.observe(el)});
  }

/* Layout bebas: blok level atas punya x (%), y (px), w (/12). Tidak ada lagi yang "mengisi kekosongan". */
function fit(){
  const r=$('#main .cv.root.free');if(!r)return;
  let b=0;[...r.children].forEach(e=>{if(e.classList.contains('blk'))b=Math.max(b,e.offsetTop+e.offsetHeight)});
  r.style.height=(b+24+(S.mode==='layout'?240:0))+'px';
}
/* Mode tampil: dropdown/kesimpulan yang terbuka mendorong blok di bawahnya (yang tumpang tindih secara horizontal); tertutup = kembali ke posisi layout */
function reflow(){
  if(S.mode!=='present')return;
  const sl=cur(),root=$('#main .cv.root.free');if(!root)return;
  const L=[...root.children].filter(e=>e.classList.contains('blk')).map(e=>{
    const b=sl.blocks.find(x=>x.id===e.dataset.id);if(!b||b.y==null)return null;
    let ex=0;e.querySelectorAll('.card.open>.cb,.concl').forEach(n=>ex+=n.offsetHeight+14);
    const x=clamp(b.x,0,100-b.w/12*100);
    return{e,ex,x0:x,x1:x+b.w/12*100,y:b.y,bot:b.y+e.offsetHeight-ex,off:0};
  }).filter(Boolean).sort((p,q)=>p.y-q.y);
  L.forEach((B,i)=>{
    for(let k=0;k<i;k++){const A=L[k];if(A.x0<B.x1-.01&&A.x1>B.x0+.01&&B.y>=A.bot-2)B.off=Math.max(B.off,A.off+A.ex)}
    B.e.style.top=(B.y+B.off)+'px';
  });
  fit();
}
const refit=()=>{if(S.mode==='present')reflow();else if(S.mode==='layout')fit()};
function place(){
  const sl=cur(),root=$('#main .cv.root');if(!root)return;
  const els=[...root.children].filter(e=>e.classList.contains('blk')),B=e=>sl.blocks.find(b=>b.id===e.dataset.id);
  if(sl.blocks.length&&sl.blocks.every(b=>b.y==null)){
    const rw=root.offsetWidth||1,off=sl.vc?root.offsetTop:0;
    els.forEach(e=>{const b=B(e);if(!b)return;b.x=+(e.offsetLeft/rw*100).toFixed(2);b.y=e.offsetTop+off;b.w=clamp(Math.round(e.offsetWidth/rw*24)/2,1,12)});
    sl.vc=false;root.parentElement.classList.remove('vc');save();
  }
  root.classList.add('free');
  const css=b=>'left:'+clamp(b.x,0,100-b.w/12*100)+'%;top:'+b.y+'px;width:'+b.w/12*100+'%';
  let bt=0;
  els.forEach(e=>{const b=B(e);if(b&&b.y!=null){e.style.cssText=css(b);bt=Math.max(bt,b.y+e.offsetHeight)}});
  els.forEach(e=>{const b=B(e);if(b&&b.y==null){b.x=0;b.y=Math.round(bt+16);e.style.cssText=css(b);bt=b.y+e.offsetHeight;save()}});
  fit();reflow();
}

}

/* ---------- AI ---------- */
async function callAI(history,system){
  const m=model(),k=cfg.key;let r,j;
  const bad=()=>new Error((j&&j.error&&(j.error.message||j.error))||('HTTP '+r.status));
  if(cfg.provider==='claude'){
    r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':k,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:m,max_tokens:800,system:system,messages:history})});
    j=await r.json();if(!r.ok)throw bad();
    return (j.content||[]).map(c=>c.text||'').join('');
  }
  if(cfg.provider==='openai'){
    r=await fetch('https://api.openai.com/v1/chat/completions',{method:'POST',headers:{'content-type':'application/json',authorization:'Bearer '+k},body:JSON.stringify({model:m,messages:[{role:'system',content:system}].concat(history)})});
    j=await r.json();if(!r.ok)throw bad();
    return j.choices[0].message.content;
  }
  r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+encodeURIComponent(m)+':generateContent',{method:'POST',headers:{'content-type':'application/json','x-goog-api-key':k},body:JSON.stringify({systemInstruction:{parts:[{text:system}]},contents:history.map(h=>({role:h.role==='assistant'?'model':'user',parts:[{text:h.content}]}))})});
  j=await r.json();if(!r.ok)throw bad();
  return ((j.candidates&&j.candidates[0]&&j.candidates[0].content.parts)||[]).map(p=>p.text||'').join('');
}
function trimHist(){
  let h=S.hist.slice(-10);
  while(h.length&&h[0].role!=='user')h.shift();
  return h;
}
async function ask(q,cacheTerm){
  const sl=ctxSlide();
  const ck=[cfg.provider,model(),slideTitle(sl),cacheTerm].join('|');
  S.msgs.push({r:'user',t:q});
  if(cacheTerm&&cache.has(ck)){
    const a=cache.get(ck);
    S.msgs.push({r:'ai',t:a,fx:1});
    S.hist.push({role:'user',content:q},{role:'assistant',content:a});
    renderBubble();return;
  }
  if(!cfg.key){S.msgs.push({r:'err',t:'API key belum diisi. Buka Pengaturan (⚙) dulu.'});renderBubble();return}
  S.hist.push({role:'user',content:q});
  S.busy=true;renderBubble();
  try{
    const a=await callAI(trimHist(),sys(sl));
    S.msgs.push({r:'ai',t:a,fx:1});
    S.hist.push({role:'assistant',content:a});
    if(cacheTerm)cache.set(ck,a);
  }catch(err){
    S.hist.pop();
    S.msgs.push({r:'err',t:'Gagal: '+(err.message||err)});
  }
  S.busy=false;renderBubble();
}
function askTerm(term){
  S.term=plain(term);

  if(!(cfg.auto&&cfg.key)){S.badge=true;updateFab();if(!$('#bubble').hidden)renderBubble();return}
  openBubble();
  ask('Jelaskan istilah atau poin ini: "'+S.term+'"',S.term);
}

const mHTML=m=>inl(esc(m)).replace(/\n/g,'<br>');
function toMarkup(el){
  let o='';
  el.childNodes.forEach(n=>{
    if(n.nodeType===3)o+=n.data.replace(/\u00a0/g,' ');
    else if(n.nodeName==='BR')o+='\n';
    else if(n.nodeType===1){
      const nm=n.nodeName,inn=toMarkup(n),z=nm==='SPAN'&&String(n.className).match(/\bz-(s|m|l|xl)\b/);
      if(nm==='B'||nm==='STRONG')o+='**'+inn+'**';
      else if(z)o+='{'+z[1]+'}'+inn+'{/'+z[1]+'}';
      else if(nm==='DIV'||nm==='P'){if(o&&!o.endsWith('\n'))o+='\n';o+=inn.replace(/\n$/,'')}
      else o+=inn;
    }
  });
  return o;
}

let pmO=null,pmTok=0;
const RM=()=>matchMedia('(prefers-reduced-motion:reduce)').matches;
const pmDelta=c=>{const r=c.getBoundingClientRect();return[pmO.x-(r.left+r.width/2),pmO.y-(r.top+r.height/2)]};
/* popup muncul dari titik klik (di mana pun posisi teksnya) lalu melebar ke tengah layar; ditutup balik ke titik itu */
function openPM(title,t,e){
  const m=(cur().modals||[]).find(x=>x.title===title);if(!m)return;
  let x=e.clientX,y=e.clientY;
  if(!e.detail){const r=t.getBoundingClientRect();x=r.left+r.width/2;y=r.top+r.height/2}
  const el=$('#pm');el.getAnimations().forEach(a=>a.cancel());
  pmO={x,y};pmTok++;pmId=m.id;renderPM();el.hidden=false;
  const c=$('.pmc',el);
  if(c&&!RM()){
    const d=pmDelta(c);
    c.animate([{transform:'translate('+d[0]+'px,'+d[1]+'px) scale(.05)',opacity:0},{transform:'none',opacity:1}],{duration:340,easing:'cubic-bezier(.2,1.1,.3,1)'});
    el.animate([{opacity:0},{opacity:1}],{duration:220});
  }
}
function closePM(an){
  pmId=null;const el=$('#pm');if(!el||el.hidden)return;
  const c=$('.pmc',el),tok=++pmTok;
  if(an&&c&&pmO&&!RM()){
    const d=pmDelta(c),a=c.animate([{transform:'none',opacity:1},{transform:'translate('+d[0]+'px,'+d[1]+'px) scale(.05)',opacity:0}],{duration:240,easing:'ease-in',fill:'forwards'});
    el.animate([{opacity:1},{opacity:0}],{duration:240,fill:'forwards'});
    a.onfinish=()=>{if(tok===pmTok){el.hidden=true;el.getAnimations().forEach(x=>x.cancel())}};
  }else el.hidden=true;
}
function renderPM(){
  const m=(cur().modals||[]).find(x=>x.id===pmId),el=$('#pm');
  if(!m){el.hidden=true;return}
  let b;inPM=true;try{b=blocksHTML(m.children,'present')}finally{inPM=false}
  el.innerHTML='<div class="pmc" role="dialog" aria-modal="true"'+(m.title?' aria-label="'+esc(m.title)+'"':'')+'><div class="pmh">'+(m.title?'<h2>'+esc(m.title)+'</h2>':'')+'<button class="btn sm" data-act="closepm" aria-label="Tutup">✕</button></div>'+(b?'<div class="cv">'+b+'</div>':'<p class="ph">Belum ada isi.</p>')+'</div>';
}
/* ---------- efek ketik balasan AI (ikut tema) ---------- */
const typing=m=>m.fx&&!m.done&&!matchMedia('(prefers-reduced-motion:reduce)').matches;
const vis=h=>{const d=document.createElement('div');d.innerHTML=h;return d.textContent.length};
function cut(h,n){
  const d=document.createElement('div');d.innerHTML=h;
  const w=document.createTreeWalker(d,NodeFilter.SHOW_TEXT);let last=null,k=n,x;
  while(k>0&&(x=w.nextNode())){if(x.length>k){x.data=x.data.slice(0,k);k=0}else k-=x.length;last=x}
  if(!last)return '';
  for(let p=last;p&&p!==d;p=p.parentNode)while(p.nextSibling)p.parentNode.removeChild(p.nextSibling);
  return d.innerHTML;
}
let tyT=0;
function kick(){
  if(tyT)return;
  const au=()=>document.documentElement.dataset.theme==='auditor',iv=()=>au()?18:30;
  const step=()=>{
    const m=S.msgs.find(typing);
    if(!m){tyT=0;return}
    const full=fmtAI(m.t),tot=vis(full);
    m.ty=(m.ty||0)+Math.max(au()?2:3,Math.ceil(tot/(3500/iv())));
    const el=$('#bm .msg[data-i="'+S.msgs.indexOf(m)+'"]'),bm=$('#bm'),stick=bm&&bm.scrollHeight-bm.scrollTop-bm.clientHeight<60;
    if(m.ty>=tot){m.done=true;if(el)el.innerHTML=full}
    else if(el)el.innerHTML=cut(full,m.ty)+'<span class="cur"></span>';
    if(stick)bm.scrollTop=bm.scrollHeight;
    tyT=setTimeout(step,iv());
  };
  tyT=setTimeout(step,iv());
}

const mk=t=>({img:()=>({id:uid(),t:'img',src:'',alt:'',w:6}),text:()=>T('','m','l'),dd:()=>({id:uid(),t:'dd',text:'',detail:'',w:4}),box:()=>({id:uid(),t:'box',title:'',children:[],w:12}),concl:()=>({id:uid(),t:'concl',label:'★ Kesimpulan',text:'',w:12})}[t]());
const reid=a=>a.forEach(b=>{b.id=uid();if(b.children)reid(b.children)});
const redraw=()=>{syncModals(cur());save();renderMain()};
function act(t){
  const a=t.dataset.act,i=+t.dataset.i,id=t.dataset.id,sl=cur(),r=S.sel?find(S.sel):null;
  if(!r&&/^(mvu|mvd|wm|wp|sz|al|bold|nudge)$/.test(a))return;
  switch(a){
    case 'mode':closePM();S.mode=t.dataset.m;S.sel=null;S.seen.clear();renderTop();renderMain();window.scrollTo(0,0);break;
    case 'full':if(document.fullscreenElement)document.exitFullscreen();else if(document.documentElement.requestFullscreen)document.documentElement.requestFullscreen();break;
    case 'settings':renderModal();break;
    case 'closemodal':$('#modal').hidden=true;break;
    case 'closepm':closePM(1);break;
    case 'fmt':if(FP.has(id))FP.delete(id);else FP.add(id);renderMain();break;
    case 'sfmt':{
      const f=find(id),key=f?fk(f.b):'text',el=$('.rte[data-id="'+id+'"][data-k="'+key+'"]');if(!f||!el)break;
      const k=t.dataset.v,rg=selR&&selR.el===el&&!selR.range.collapsed?selR.range:null;
      if(!rg){if(f.b.t!=='text'){toast('Blok teks dulu untuk mengatur ukuran atau tebal');break}if(k==='b')f.b.b=!f.b.b;else f.b.size=k;redraw();toast('Tanpa blok teks: berlaku ke seluruh teks');break}
      const g=getSelection();el.focus({preventScroll:true});g.removeAllRanges();g.addRange(rg);
      if(k==='b')document.execCommand('bold');
      else{
        const r=g.getRangeAt(0),fr=r.extractContents();
        fr.querySelectorAll('span').forEach(sp=>{if(/\bz-/.test(sp.className)){while(sp.firstChild)sp.parentNode.insertBefore(sp.firstChild,sp);sp.remove()}});
        const sp=document.createElement('span');sp.className='z-'+k;sp.appendChild(fr);r.insertNode(sp);
        g.removeAllRanges();const nr=document.createRange();nr.selectNodeContents(sp);g.addRange(nr);
        el.dispatchEvent(new Event('input',{bubbles:true}));
      }
      break}
    case 'tsz':case 'tal':case 'tbold':{const f=find(id);if(!f)break;if(a==='tsz')f.b.size=t.dataset.v;else if(a==='tal')f.b.align=t.dataset.v;else f.b.b=!f.b.b;redraw();break}
    case 'savecfg':
      cfg={provider:$('#cp').value,model:$('#cm').value.trim(),key:$('#ck').value.trim(),auto:$('#ca').checked};
      LS('opres.cfg',cfg);$('#modal').hidden=true;if(!$('#bubble').hidden)renderBubble();break;
    case 'fab':if($('#bubble').hidden)openBubble();else $('#bubble').hidden=true;break;
    case 'closebubble':$('#bubble').hidden=true;break;
    case 'clearchat':S.msgs=[];S.hist=[];renderBubble();break;
    case 'explainterm':if(S.term&&!S.busy)ask('Jelaskan istilah atau poin ini: "'+S.term+'"',S.term);break;
    case 'prev':go(-1);break;
    case 'next':go(1);break;
    case 'card':{
      const c=t.closest('.card');
      if(S.open.has(id)){S.open.delete(id);c.classList.remove('open')}
      else{S.open.add(id);c.classList.add('open');const f=find(id);if(f)askTerm(f.b.text)}
      reflow();break}
    case 'concl':if(S.open.has(id))S.open.delete(id);else S.open.add(id);if(t.closest('#pm'))renderPM();else renderMain();break;
    case 'sel':closePM();if(i!==S.i)S.anim=i>S.i?'next':'prev';S.seen.clear();S.i=i;S.sel=null;renderMain();window.scrollTo(0,0);break;
    case 'addslide':deck.slides.splice(S.i+1,0,{id:uid(),name:'Slide '+(deck.slides.length+1),bg:'',vc:false,blocks:[]});S.i++;S.sel=null;redraw();break;
    case 'dupslide':{const c=JSON.parse(JSON.stringify(sl));c.id=uid();reid(c.blocks);(c.modals||[]).forEach(m=>{m.id=uid();reid(m.children)});c.name=(c.name||'Slide')+' (salinan)';deck.slides.splice(S.i+1,0,c);S.i++;redraw();break}

      if(deck.slides.length<2){alert('Minimal harus ada satu slide.');break}
      if(confirm('Hapus slide ini?')){deck.slides.splice(S.i,1);S.i=Math.min(S.i,deck.slides.length-1);redraw()}
      break;
    case 'up':if(S.i>0){[deck.slides[S.i-1],deck.slides[S.i]]=[deck.slides[S.i],deck.slides[S.i-1]];S.i--;redraw()}break;
    case 'down':if(S.i<deck.slides.length-1){[deck.slides[S.i+1],deck.slides[S.i]]=[deck.slides[S.i],deck.slides[S.i+1]];S.i++;redraw()}break;

      m.hidden=false;break}

    case 'exportjson':download(slug()+'.json',JSON.stringify(deck,null,2),'application/json');break;
    case 'import':importJSON();break;
    case 'reset':if(confirm('Kembalikan ke contoh awal? Isi saat ini akan hilang.')){deck=base();S.i=0;S.sel=null;S.open.clear();redraw();renderTop()}break;
  }
}
app.addEventListener('click',e=>{
  if(e.target.id==='modal'){$('#modal').hidden=true;return}
  if(e.target.id==='pm'){closePM(1);return}
  if(Date.now()-S.dragEnd<300||e.target.closest('.mv,.rz,#insp .ih'))return;
  const t=e.target.closest('[data-act],.term');
  if(t&&t.dataset.act){act(t);return}
  if(t&&S.mode==='present'){if(t.dataset.mt!==undefined)openPM(t.dataset.mt,t,e);else if(t.dataset.term)askTerm(t.dataset.term);return}
  if(S.mode==='layout'){
    const b=e.target.closest('.blk'),id=b?b.dataset.id:null;
    if(e.target.closest('#insp'))return;
    if(id!==S.sel){S.sel=id;renderMain()}
  }
});
app.addEventListener('input',e=>{
  const t=e.target,f=t.dataset.f;
  if(f==='dt'){deck.title=t.value;$('.brand').textContent=t.value||'Presentasi';document.title=t.value||'Presentasi'}
  else if(f==='sn')cur().name=t.value;
  else if(t.dataset.k&&t.dataset.id){const r=find(t.dataset.id);if(!r)return;r.b[t.dataset.k]=t.isContentEditable?toMarkup(t):t.value;if(t.classList.contains('autog'))grow(t);resync();const pv=$('#pv-'+t.dataset.id);if(pv)pv.innerHTML=prevHTML(r.b)}
  else return;
  save();
});

/* ---------- layout: seret urutan (✥) & ubah lebar (kotak pojok) ---------- */
let dr=null;
app.addEventListener('pointerdown',e=>{
  const h=e.target.closest('.mv,.rz');if(!h)return;
  const el=h.closest('.blk'),r=find(el.dataset.id);if(!r)return;
  e.preventDefault();
  if(h.classList.contains('rz')){
    const g=el.parentElement,gr=g.getBoundingClientRect(),gap=parseFloat(getComputedStyle(g).columnGap)||0;
    dr={k:'rz',el,b:r.b,x:e.clientX,w:r.b.w,cw:(gr.width+gap)/12,free:g.classList.contains('free')};
  }else if(el.parentElement.classList.contains('free')){dr={k:'fm',el,b:r.b,x:e.clientX,y:e.clientY,sy:window.scrollY,bx:r.b.x,by:r.b.y,rw:el.parentElement.offsetWidth||1};el.classList.add('drag')}else{dr={k:'mv',el,arr:r.arr};el.classList.add('drag')}
  try{h.setPointerCapture(e.pointerId)}catch(_){}
});
app.addEventListener('pointermove',e=>{
  if(!dr)return;
  if(e.clientY<90)window.scrollBy(0,-14);else if(e.clientY>innerHeight-90)window.scrollBy(0,14);
  if(dr.k==='rz'){
    const raw=dr.w+(e.clientX-dr.x)/dr.cw,w=dr.free?clamp(Math.round(raw*2)/2,1,12):clamp(Math.round(raw),2,12);
    if(w!==dr.b.w){dr.b.w=w;if(dr.free)dr.el.style.width=w/12*100+'%';else dr.el.style.gridColumn='span '+w;const wb=$('.wb',dr.el);if(wb)wb.textContent=w+'/12'}
  }else if(dr.k==='fm'){
    const nx=+clamp(dr.bx+(e.clientX-dr.x)/dr.rw*100,0,100-dr.b.w/12*100).toFixed(2),ny=Math.max(0,Math.round(dr.by+e.clientY-dr.y+window.scrollY-dr.sy));
    dr.b.x=nx;dr.b.y=ny;dr.el.style.left=nx+'%';dr.el.style.top=ny+'px';
  }else{
    const p=dr.el.parentElement,a=dr.el.getBoundingClientRect();
    for(const s of p.children){
      if(s===dr.el||!s.classList.contains('blk'))continue;
      const q=s.getBoundingClientRect();
      if(e.clientX>=q.left&&e.clientX<=q.right&&e.clientY>=q.top&&e.clientY<=q.bottom){
        const same=Math.abs(a.top-q.top)<20,after=same?a.left<q.left:a.top<q.top;
        p.insertBefore(dr.el,after?s.nextSibling:s);break;
      }
    }
  }
});
function endDrag(){
  if(!dr)return;const d=dr;dr=null;S.dragEnd=Date.now();
  if(d.k==='mv'){
    const ids=[...d.el.parentElement.children].filter(c=>c.classList.contains('blk')).map(c=>c.dataset.id),m=new Map(d.arr.map(b=>[b.id,b]));
    d.arr.splice(0,d.arr.length,...ids.map(x=>m.get(x)));
  }
  save();renderMain();
}
app.addEventListener('pointerup',endDrag);
app.addEventListener('pointercancel',endDrag);

app.addEventListener('submit',e=>{
  if(e.target.id!=='bf')return;
  e.preventDefault();
  const v=$('#bi').value.trim();
  if(v&&!S.busy){$('#bi').value='';ask(v)}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if($('#lb'))return;if(!$('#pm').hidden){closePM(1);return}$('#modal').hidden=true;$('#bubble').hidden=true;return}
  if(S.mode!=='present')return;
  if(!$('#pm').hidden)return;const tag=document.activeElement.tagName;
  if(/INPUT|TEXTAREA|SELECT/.test(tag))return;
  if(e.key===' '&&tag==='BUTTON')return;
  if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();go(1)}
  else if(['ArrowLeft','PageUp'].includes(e.key)){go(-1)}
});
let tx=0,ty=0;
$('#main').addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
$('#main').addEventListener('touchend',e=>{
  if(S.mode!=='present')return;
  const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;
  if(Math.abs(dx)>70&&Math.abs(dy)<50)go(dx<0?1:-1);
},{passive:true});

let tt;
function toast(m){
  let el=$('#toast');
  if(!el){el=document.createElement('div');el.id='toast';document.body.appendChild(el)}
  el.textContent=m;void el.offsetWidth;el.classList.add('show');
  clearTimeout(tt);tt=setTimeout(()=>el.classList.remove('show'),2200);
}
document.addEventListener('fullscreenchange',()=>{
  const on=!!document.fullscreenElement;
  document.documentElement.classList.toggle('fs',on);
  if(on)toast('Tekan ESC untuk keluar dari layar penuh');
});
/* ---------- gambar ---------- */
function readImg(f){
  return new Promise((res,rej)=>{
    const fr=new FileReader();fr.onerror=rej;
    fr.onload=()=>{
      if(/svg|gif/.test(f.type)){if(f.size>1.5e6)return rej(new Error('big'));return res(fr.result)}
      const im=new Image();im.onerror=rej;
      im.onload=()=>{
        const k=Math.min(1,2000/Math.max(im.width,im.height)),c=document.createElement('canvas'),keep=/png|webp/.test(f.type);
        c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
        const x=c.getContext('2d');
        if(!keep){x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height)}
        x.drawImage(im,0,0,c.width,c.height);
        res(keep?c.toDataURL('image/webp',.9):c.toDataURL('image/jpeg',.85));
      };
      im.src=fr.result;
    };
    fr.readAsDataURL(f);
  });
}
function pickImg(cb){
  const i=document.createElement('input');i.type='file';i.accept='image/*';
  i.onchange=async()=>{
    const f=i.files[0];if(!f)return;
    try{cb(await readImg(f))}
    catch(e){toast(e&&e.message==='big'?'File SVG/GIF terlalu besar (maks 1,5 MB)':'Gambar gagal dibaca. Format mungkin tidak didukung browser ini.')}
  };
  i.click();
}
app.addEventListener('click',e=>{
  if(S.mode==='present'&&e.target.classList.contains('zm')){
    const lb=document.createElement('div');lb.id='lb';lb.innerHTML='<img src="'+esc(e.target.src)+'" alt="">';
    lb.onclick=()=>lb.remove();document.body.appendChild(lb);
  }
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){const l=$('#lb');if(l)l.remove()}});
app.addEventListener('mousedown',e=>{if(e.target.closest('.fmtp button'))e.preventDefault()});
app.addEventListener('beforeinput',e=>{if(e.target.classList&&e.target.classList.contains('rte')&&e.inputType==='insertParagraph'){e.preventDefault();document.execCommand('insertLineBreak')}});
app.addEventListener('paste',e=>{if(e.target.classList&&e.target.classList.contains('rte')){e.preventDefault();document.execCommand('insertText',false,(e.clipboardData||window.clipboardData).getData('text/plain'))}});
/* ---------- efek klik per tema ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest&&e.target.closest('.btn,.term,.ch,#fab,.chip,.tcard');
  if(!t||t.disabled||matchMedia('(prefers-reduced-motion:reduce)').matches)return;
  let x=e.clientX,y=e.clientY;
  if(!e.detail){const r=t.getBoundingClientRect();x=r.left+r.width/2;y=r.top+r.height/2}
  const th=document.documentElement.dataset.theme||'brutal',el=document.createElement('span');
  el.className='fx fx-'+th;el.style.left=x+'px';el.style.top=y+'px';
  if(th==='brutal'){let h='<b></b>';for(let i=0;i<6;i++){const a=i/6*Math.PI*2+Math.random()*.5,d=34+Math.random()*18;h+='<i style="--dx:'+(Math.cos(a)*d).toFixed(1)+'px;--dy:'+(Math.sin(a)*d).toFixed(1)+'px;--c:'+['var(--acc)','var(--acc2)','var(--acc3)'][i%3]+'"></i>'}el.innerHTML=h}
  document.body.appendChild(el);setTimeout(()=>el.remove(),700);
});
renderAll();
})();
